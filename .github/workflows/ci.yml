name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare with base
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Without a usable base (e.g. first push), run everything.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          echo "$changed"

          # A change to this workflow runs every job.
          match() {
            if echo "$changed" | grep -qE "^($1|\.github/workflows/ci\.yml$)"; then echo true; else echo false; fi
          }
          echo "backend=$(match 'backend/')" >> "$GITHUB_OUTPUT"
          echo "android=$(match 'android/')" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: seafood_marketplace_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: seafood_marketplace_test
      DB_USERNAME: postgres
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Fails on any advisory; one without a fix yet may only be ignored in
      # composer.json (config.audit.ignore) with a reason and a review date.
      - name: Audit Composer packages
        run: composer audit --locked

      # Reads package-lock.json only, so no npm install is needed.
      - name: Audit npm packages
        run: npm audit --audit-level=high

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint, static analysis, tests
        run: composer check

  # Placeholder until the Android app exists (Tahap 4).
  # TODO(Tahap 4): set up JDK and Gradle cache, run ktlint, detekt, unit tests, and assembleDebug.
  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Placeholder
        run: |
          echo "Android checks are added in Tahap 4."
          if [ -d android ]; then ls -la android; fi

  # The only required status check in the main ruleset. Skipped jobs count as passed,
  # so new jobs only need to be added to `needs` here.
  ci:
    name: CI
    if: always()
    needs: [changes, backend, android]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
