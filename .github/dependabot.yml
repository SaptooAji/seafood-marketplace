# Weekly dependency updates. Security updates come on top of these as soon as
# an advisory is published (enabled in Settings → Advanced Security).
# Commit messages read `chore(deps): ...` or `chore(deps-dev): ...`.
version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels: [chore, backend]
    # One PR for all minor and patch bumps; majors get their own PR.
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels: [chore, backend]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Reads android/gradle/libs.versions.toml and the Gradle wrapper. Android
  # Studio limits the AGP version (see the comment in libs.versions.toml), so
  # an AGP bump may need to wait for an Android Studio update.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels: [chore, android]
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels: [chore, ci]
